<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2025 Radiology Anki</title>
<style>
:root{
    --canvas:#f5f5f5; --card-bg:#ffffff; --fg:#111111; --fg-sub:#5f5f5f; --fg-faint:#a3a3a3;
    --border:#c8c8c8; --border-soft:#e3e3e3; --tb-bg:#efefef; --bar-bg:#ececec;
    --btn-top:#ffffff; --btn-bot:#e9e9e9; --btn-border:#b4b4b4; --btn-fg:#111111;
    --hover:#e4ecfb; --sel:#cddffc; --link:#1d4ed8; --focus:rgba(37,99,235,.35);
    --new:#2563eb; --learn:#dc2626; --review:#16a34a; --filtered:#2563eb;
    --good-bg:#aaffaa; --bad-bg:#ffaaaa; --miss-bg:#cccccc; --part-bg:#ffe08a; --type-fg:#000000;
    --tip-bg:#3a3a3a; --tip-fg:#ffffff; --zebra:#f7f7f7;
}
@media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
        --canvas:#2c2c2c; --card-bg:#2f2f31; --fg:#e8e8e8; --fg-sub:#b0b0b0; --fg-faint:#777777;
        --border:#4d4d4d; --border-soft:#3c3c3c; --tb-bg:#262626; --bar-bg:#262626;
        --btn-top:#4a4a4a; --btn-bot:#3c3c3c; --btn-border:#5c5c5c; --btn-fg:#f0f0f0;
        --hover:#3a4458; --sel:#34507e; --link:#7aa7ff; --focus:rgba(122,167,255,.45);
        --new:#60a5fa; --learn:#f87171; --review:#4ade80; --filtered:#7aa7ff;
        --good-bg:#78d878; --bad-bg:#f08080; --miss-bg:#9a9a9a; --part-bg:#e5c34f; --type-fg:#111111;
        --tip-bg:#e5e5e5; --tip-fg:#111111; --zebra:#333335;
    }
}
:root[data-theme="dark"]{
    --canvas:#2c2c2c; --card-bg:#2f2f31; --fg:#e8e8e8; --fg-sub:#b0b0b0; --fg-faint:#777777;
    --border:#4d4d4d; --border-soft:#3c3c3c; --tb-bg:#262626; --bar-bg:#262626;
    --btn-top:#4a4a4a; --btn-bot:#3c3c3c; --btn-border:#5c5c5c; --btn-fg:#f0f0f0;
    --hover:#3a4458; --sel:#34507e; --link:#7aa7ff; --focus:rgba(122,167,255,.45);
    --new:#60a5fa; --learn:#f87171; --review:#4ade80; --filtered:#7aa7ff;
    --good-bg:#78d878; --bad-bg:#f08080; --miss-bg:#9a9a9a; --part-bg:#e5c34f; --type-fg:#111111;
    --tip-bg:#e5e5e5; --tip-fg:#111111; --zebra:#333335;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--canvas);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;min-height:100vh;}
body.reviewing{background:var(--card-bg);}
a{color:var(--link);}
[hidden]{display:none!important;}

/* top toolbar */
#toolbar{display:flex;justify-content:center;gap:4px;padding:7px 10px;background:var(--tb-bg);border-bottom:1px solid var(--border-soft);}
#toolbar a{padding:4px 12px;border-radius:5px;color:var(--fg);text-decoration:none;cursor:pointer;font-size:14px;user-select:none;}
#toolbar a:hover{background:var(--hover);}
#toolbar a.on{font-weight:600;}

/* Anki buttons */
button.ab{font:inherit;font-size:14px;color:var(--btn-fg);background:linear-gradient(var(--btn-top),var(--btn-bot));border:1px solid var(--btn-border);border-radius:6px;padding:6px 14px;min-height:32px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.06);white-space:nowrap;}
button.ab:hover{background:var(--hover);}
button.ab:active{background:var(--sel);}
button.ab:disabled{opacity:.45;cursor:default;background:linear-gradient(var(--btn-top),var(--btn-bot));}
button.ab.focus,button.ab:focus-visible{outline:none;border-color:var(--link);box-shadow:0 0 0 3px var(--focus);}
button.ab.big{font-size:15px;padding:8px 22px;}

.scr{display:none;}
.scr.on{display:block;}

/* deck browser */
.deckbrowser{max-width:640px;margin:28px auto 0;padding:0 12px 40px;}
table.decks{width:100%;border-collapse:collapse;}
table.decks th{font-weight:400;color:var(--fg-sub);font-size:13px;text-align:right;padding:4px 10px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
table.decks td.cnt{white-space:nowrap;min-width:52px;}
table.decks th.dname{text-align:left;}
table.decks td{padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums;}
table.decks td.dname{text-align:left;width:100%;}
table.decks tr.deck{cursor:pointer;}
table.decks tr.deck:hover td{background:var(--hover);}
table.decks tr.deck.current td{background:var(--sel);}
table.decks tr.deck td:first-child{border-radius:5px 0 0 5px;}
table.decks tr.deck td:last-child{border-radius:0 5px 5px 0;}
.collapse{display:inline-block;width:16px;color:var(--fg-sub);font-family:ui-monospace,Menlo,Consolas,monospace;cursor:pointer;}
.deckname{color:var(--fg);}
.deckname.filtered{color:var(--filtered);}
.child .dname{padding-left:34px!important;}
.cnt.new{color:var(--new);} .cnt.learn{color:var(--learn);} .cnt.review{color:var(--review);}
.cnt.zero{color:var(--fg-faint);}
.studied{text-align:center;color:var(--fg-sub);margin-top:22px;font-size:13px;}
.dbnote{text-align:center;color:var(--fg-faint);margin-top:8px;font-size:12px;}

/* overview */
.overview{max-width:560px;margin:40px auto 0;padding:0 16px 40px;text-align:center;}
.overview h3{font-weight:400;font-size:22px;margin-bottom:18px;}
table.ovc{margin:0 auto 22px;border-collapse:collapse;font-size:15px;}
table.ovc td{padding:3px 8px;}
table.ovc td:first-child{text-align:right;color:var(--fg);}
table.ovc td:last-child{text-align:left;font-variant-numeric:tabular-nums;}
.ov-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px;}
.desc{color:var(--fg-sub);font-size:13px;line-height:1.7;}
.congrats{margin:6px auto 22px;line-height:1.8;}
.congrats b{display:block;font-size:17px;margin-bottom:6px;}
.congrats p{color:var(--fg-sub);font-size:14px;}
.sum-table{margin:0 auto 20px;border-collapse:collapse;font-size:15px;}
.sum-table td{padding:3px 10px;}
.sum-table td:first-child{text-align:right;color:var(--fg-sub);}
.sum-table td:last-child{text-align:left;font-weight:600;}

/* reviewer card (Anki default card template look) */
.card{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:20px;text-align:center;color:var(--fg);background:var(--card-bg);}
#qa{max-width:980px;margin:0 auto;padding:18px 14px 28px;}
.meta{font-size:13px;color:var(--fg-sub);margin-bottom:10px;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;}
.meta .st-new{color:var(--new);} .meta .st-learn{color:var(--learn);} .meta .st-review{color:var(--review);}
.qtext{font-size:19px;margin:4px auto 12px;max-width:760px;line-height:1.5;}
.imgs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin:6px 0 16px;}
.img-crop-wrap{position:relative;border-radius:4px;background:#111;cursor:zoom-in;max-width:100%;overflow:hidden;}
.img-inner-box{position:absolute;top:-37.3134%;left:-25.7575%;width:151.5151%;height:149.2537%;pointer-events:none;}
.img-inner-box img{display:block;width:100%;height:100%;object-fit:cover;}
.img-inner-box.no-crop{top:0;left:0;width:100%;height:100%;}
.img-inner-box.no-crop img{object-fit:contain;}
.imgs.multi .img-crop-wrap,.imgs.many .img-crop-wrap{max-width:calc(50% - 6px);}
.img-loading{font-size:12px;color:#aaa;font-family:system-ui,sans-serif;}
#typeForm{max-width:760px;margin:0 auto;}
#typeans{width:100%;font-family:ui-monospace,Menlo,Consolas,"D2Coding","Apple SD Gothic Neo",monospace;font-size:18px;line-height:1.75;padding:2px 8px;color:var(--fg);background:var(--card-bg);border:1px solid var(--border);border-radius:3px;}
#typeans:focus{outline:none;border-color:var(--link);box-shadow:0 0 0 2px var(--focus);}
#typeans:disabled{opacity:.75;}
#typeForm.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
hr#answerHr{border:none;border-top:1px solid var(--border);margin:22px 0 18px;}
.typecmp{display:inline-block;max-width:100%;font-family:ui-monospace,Menlo,Consolas,"D2Coding","Apple SD Gothic Neo",monospace;font-size:18px;line-height:1.9;text-align:center;word-break:break-word;}
.typearrow{color:var(--fg-sub);line-height:1.2;}
.typeGood{background:var(--good-bg);color:var(--type-fg);}
.typeBad{background:var(--bad-bg);color:var(--type-fg);}
.typeMissed{background:var(--miss-bg);color:var(--type-fg);}
.typePart{background:var(--part-bg);color:var(--type-fg);}
.typeStop{color:var(--fg-sub);}
.typeEmpty{color:var(--fg-faint);font-style:italic;}
.paren-extra{border-bottom:2px dotted currentColor;}
.grade-note{font-size:13px;color:var(--fg-sub);margin-top:12px;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;}
.grade-note .lg{display:inline-flex;gap:10px;margin-left:8px;flex-wrap:wrap;}
.grade-note i{display:inline-block;width:10px;height:10px;margin-right:3px;vertical-align:-1px;border-radius:2px;}
.keyhead{font-size:13px;color:var(--fg-sub);margin:22px 0 8px;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;}
.keyimgs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.keyimgs .img-crop-wrap{max-width:calc(50% - 5px);}
.memo{max-width:760px;margin:22px auto 0;text-align:left;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;}
.memo label{display:block;font-size:12px;color:var(--fg-sub);margin-bottom:3px;}
.memo textarea{width:100%;min-height:54px;font:inherit;font-size:14px;color:var(--fg);background:var(--card-bg);border:1px solid var(--border);border-radius:4px;padding:6px 8px;resize:vertical;}
.memo textarea:focus{outline:none;border-color:var(--link);box-shadow:0 0 0 2px var(--focus);}

/* bottom bar */
#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bar-bg);border-top:1px solid var(--border);padding:8px 10px calc(8px + env(safe-area-inset-bottom));}
#bottombar:empty{display:none;}
.bar-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;max-width:1100px;margin:0 auto;}
.bar-left{justify-self:start;} .bar-right{justify-self:end;position:relative;}
.bar-center{display:flex;flex-direction:column;align-items:center;gap:4px;}
.bar-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:1100px;margin:0 auto;}
.counts{font-size:14px;font-variant-numeric:tabular-nums;color:var(--fg-sub);}
.counts .new{color:var(--new);} .counts .learn{color:var(--learn);} .counts .review{color:var(--review);}
.counts u{text-underline-offset:3px;}
.ease-row{display:flex;gap:8px;}
.ease{display:flex;flex-direction:column;align-items:center;gap:2px;}
.ease .ivl{font-size:12px;color:var(--fg-sub);font-variant-numeric:tabular-nums;}
.ease button.ab{min-width:84px;}
.ease.e1 .lbl{color:var(--learn);} .ease.e4 .lbl{color:var(--new);} .ease.e3 .lbl{color:var(--review);}
.morebtn{min-width:40px;}
.menu{position:absolute;right:0;bottom:calc(100% + 6px);background:var(--card-bg);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:220px;padding:4px;display:none;z-index:70;}
.menu.on{display:block;}
.menu button{display:flex;justify-content:space-between;gap:16px;width:100%;background:none;border:none;color:var(--fg);font:inherit;font-size:14px;padding:7px 10px;border-radius:4px;cursor:pointer;text-align:left;}
.menu button:hover:not(:disabled){background:var(--hover);}
.menu button:disabled{opacity:.4;cursor:default;}
.menu kbd{font:inherit;font-size:12px;color:var(--fg-faint);}
.menu hr{border:none;border-top:1px solid var(--border-soft);margin:4px 0;}

/* browse */
.browse{max-width:1100px;margin:0 auto;padding:12px;}
.bhead{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.bhead input,.bhead select,.dlg input[type=number],.dlg input[type=text],.dlg select{font:inherit;font-size:14px;color:var(--fg);background:var(--card-bg);border:1px solid var(--border);border-radius:5px;padding:6px 9px;}
.bhead input{flex:1;min-width:200px;}
.bhead input:focus,.bhead select:focus,.dlg input:focus,.dlg select:focus{outline:none;border-color:var(--link);box-shadow:0 0 0 2px var(--focus);}
.btable-wrap{border:1px solid var(--border);border-radius:5px;overflow:auto;background:var(--card-bg);max-height:calc(100vh - 170px);}
table.btable{width:100%;border-collapse:collapse;font-size:13px;}
table.btable th{position:sticky;top:0;background:var(--tb-bg);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none;}
table.btable th .arr{color:var(--fg-faint);font-weight:400;}
table.btable td{padding:5px 8px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
table.btable td.sf{white-space:normal;min-width:260px;}
table.btable tr:nth-child(even) td{background:var(--zebra);}
table.btable tbody tr{cursor:pointer;}
table.btable tbody tr:hover td{background:var(--hover);}
.bfoot{color:var(--fg-sub);font-size:12px;margin-top:8px;}
.s-new{color:var(--new);} .s-learn{color:var(--learn);} .s-review{color:var(--review);}

/* stats */
.stats{max-width:620px;margin:24px auto 0;padding:0 16px 40px;}
.stats h3{font-size:16px;font-weight:600;margin:22px 0 8px;border-bottom:1px solid var(--border-soft);padding-bottom:4px;}
.stats p{color:var(--fg-sub);line-height:1.8;}
table.st{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;}
table.st td,table.st th{padding:4px 14px 4px 0;text-align:left;}
table.st th{font-weight:400;color:var(--fg-sub);}

/* dialogs */
.dlg-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:center;justify-content:center;padding:16px;}
.dlg-bg.on{display:flex;}
.dlg{background:var(--card-bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:100%;max-width:440px;max-height:90vh;overflow:auto;}
.dlg h4{font-size:14px;font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border-soft);background:var(--tb-bg);border-radius:8px 8px 0 0;}
.dlg .body{padding:14px;}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--border-soft);}
.dlg .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;}
.dlg .row small{display:block;color:var(--fg-faint);font-size:12px;}
.dlg .row input{width:110px;text-align:center;}
.dlg .sec{border-top:1px solid var(--border-soft);margin-top:12px;padding-top:12px;}
.dlg .sec .btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.dlg .hint{font-size:12px;color:var(--fg-faint);line-height:1.6;}
.dlg label.opt{display:flex;align-items:center;gap:8px;padding:5px 2px;cursor:pointer;}
.dlg label.opt input{accent-color:var(--link);}
.dlg .rangein{display:inline-flex;gap:6px;align-items:center;margin-left:4px;}
.dlg .rangein input{width:70px;padding:3px 6px;}
.dlg .deckline{font-size:13px;color:var(--fg-sub);margin-bottom:8px;}

.img-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;align-items:center;justify-content:center;cursor:zoom-out;}
.img-modal.on{display:flex;}
.img-modal-container{position:relative;border-radius:4px;overflow:hidden;display:inline-block;}
#tip{position:fixed;left:14px;bottom:76px;z-index:400;background:var(--tip-bg);color:var(--tip-fg);font-size:13px;padding:7px 12px;border-radius:5px;box-shadow:0 3px 12px rgba(0,0,0,.2);opacity:0;transform:translateY(6px);transition:opacity .15s, transform .15s;pointer-events:none;max-width:calc(100vw - 28px);}
#tip.on{opacity:1;transform:none;}
.credit{text-align:center;color:var(--fg-faint);font-size:12px;padding:18px 12px 8px;}
.credit a{color:var(--fg-faint);}

@media (max-width:640px){
    .imgs.multi .img-crop-wrap,.imgs.many .img-crop-wrap,.keyimgs .img-crop-wrap{max-width:100%;}
    .card{font-size:18px;}
    .typecmp,#typeans{font-size:16px;}
    .bar-grid{grid-template-columns:auto 1fr auto;gap:6px;}
    .ease-row{gap:5px;width:100%;}
    .ease{flex:1;min-width:0;}
    .ease button.ab{min-width:0;width:100%;padding:6px 4px;}
    .bar-left button.ab{padding:6px 8px;font-size:13px;}
    #tip{bottom:84px;}
    table.btable .hide-sm{display:none;}
}
</style>
</head>
<body>

<nav id="toolbar">
    <a data-go="decks" title="덱 (D)">덱</a>
    <a data-go="browse" title="탐색 (B)">탐색</a>
    <a data-go="stats" title="통계 (T)">통계</a>
    <a data-go="options" title="설정">설정</a>
</nav>

<main>
    <section id="scrDecks" class="scr"></section>
    <section id="scrOverview" class="scr"></section>
    <section id="scrReview" class="scr">
        <div class="card" id="qa">
            <div class="meta" id="meta"></div>
            <div class="qtext" id="qtext" hidden></div>
            <div class="imgs" id="fImgs"></div>
            <form id="typeForm" autocomplete="off" onsubmit="event.preventDefault();reveal();">
                <input id="typeans" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="정답 입력 (소견이 여러 개면 쉼표로)">
            </form>
            <div id="answerPart" hidden>
                <hr id="answerHr">
                <div class="typecmp" id="typecmp"></div>
                <div class="grade-note" id="gradeNote"></div>
                <div id="keyPart"></div>
                <div class="memo"><label for="memo">메모 (자동 저장)</label><textarea id="memo" placeholder="이 카드에 대한 메모"></textarea></div>
            </div>
        </div>
    </section>
    <section id="scrBrowse" class="scr">
        <div class="browse">
            <div class="bhead">
                <input id="bq" type="search" placeholder="검색 — 예: cyst · 12 · is:new · is:due · is:learn · is:review · deck:Chest">
                <select id="bdeck"></select>
            </div>
            <div class="btable-wrap">
                <table class="btable">
                    <thead><tr>
                        <th data-sort="ans">정렬 필드</th><th data-sort="num">No.</th><th data-sort="cat">덱</th>
                        <th data-sort="due">기한</th><th data-sort="ivl" class="hide-sm">간격</th><th data-sort="ease" class="hide-sm">이지</th><th data-sort="lapses" class="hide-sm">실패</th>
                    </tr></thead>
                    <tbody id="btbody"></tbody>
                </table>
            </div>
            <div class="bfoot" id="bfoot"></div>
        </div>
    </section>
    <section id="scrStats" class="scr"></section>
</main>

<footer id="bottombar"></footer>

<div class="dlg-bg" id="dlgOptions">
    <div class="dlg">
        <h4>설정</h4>
        <div class="body">
            <div class="row"><div>하루 새 카드 수</div><input type="number" id="cfgNew" min="0" max="117"></div>
            <div class="row"><div>학습 단계 (분)<small>공백으로 구분, 예: 1 10</small></div><input type="text" id="cfgSteps"></div>
            <div class="row"><div>재학습 단계 (분)</div><input type="text" id="cfgRelearn"></div>
            <div class="row"><div>졸업 간격 / 쉬움 간격 (일)<small>예: 1 4</small></div><input type="text" id="cfgGrad"></div>
            <div class="row"><div>테마</div><select id="cfgTheme"><option value="auto">시스템 설정</option><option value="light">라이트</option><option value="dark">다크 (야간 모드)</option></select></div>
            <div class="sec">
                <div class="btns">
                    <button class="ab" onclick="exportData()">학습 기록 백업</button>
                    <button class="ab" onclick="document.getElementById('importFile').click()">백업 불러오기</button>
                    <input type="file" id="importFile" accept="application/json,.json" hidden onchange="importData(this)">
                </div>
                <div class="btns"><button class="ab" style="color:var(--learn)" onclick="resetProgress()">학습 기록 초기화</button></div>
                <div class="hint">학습 기록은 이 브라우저에 저장돼요. 다른 기기로 옮기려면 백업 파일을 내보내서 불러오세요.</div>
            </div>
        </div>

        ['acoustic neuroma','vestibular schwannoma'],['glioblastoma multiforme','glioblastoma'],
        ['cerebral venous thrombosis','venous sinus thrombosis'],['dural sinus thrombosis','venous sinus thrombosis'],['cerebral venous sinus thrombosis','venous sinus thrombosis'],
        ['avascular necrosis','osteonecrosis'],['agc','advanced gastric cancer'],['egc','early gastric cancer'],['papillary thyroid carcinoma','papillary carcinoma thyroid'],
        ['cyst adenocarcinoma','cystadenocarcinoma'],['lymph node','ln'],['lymphadenopathy','ln'],['gall bladder','gb'],['corpus luteum','corpus luteal'],
        ['lymphnode','ln'],['epidermoid cyst','epidermoid'],
        ['herpes zoster oticus','ramsay hunt syndrome'],['ruptured aneurysm','aneurysm rupture'],
        ['pulmonary arteriovenous malformation','pavm'],['pulmonary avm','pavm'],
        ['free fluid','ascites']
    ];
    const STOP=new Set(['with','and','of','the','an','a','in','on','at','to','from','for','by','or','mainly','disease','is','are','due',
        'suspicious','suspected','probable','possible','likely','consistent','status','post','type','r','o','s','p','w','x','vs','level','pattern','gland']);
    const isKo=t=>/[가-힣]/.test(t);
    function stem(w){
        if(isKo(w)||/\d/.test(w)) return w;
        if(w.length>4&&w.endsWith('ies')) return w.slice(0,-3)+'y';
        if(w.length>4&&/(ss|x|ch|sh)es$/.test(w)) return w.slice(0,-2);
        if(w.length>3&&w.endsWith('s')&&!/(ss|is|us)$/.test(w)) return w.slice(0,-1);
        return w;
    }
    function canonWord(w){
        w=w.toLowerCase();
        if(SYN[w]) return SYN[w];
        const s=stem(w);
        return SYN[s]||s;
    }
    const canonSeq=str=>str.split(/\s+/).filter(Boolean).flatMap(w=>canonWord(w).split(' '));
    const PRE_C=PRE.map(([a,b])=>[a.split(' '),b]);
    const PHR_C=PHRASES.map(([a,b])=>[canonSeq(a).filter(t=>!STOP.has(t)),canonSeq(b)])
        .filter(([a])=>a.length).sort((x,y)=>y[0].length-x[0].length);
    function applyRules(toks,rules,outIsSeq){
        const same=outIsSeq?((a,b)=>a===b||eq(a,b)):((a,b)=>a===b);
        let changed=true,guard=0;
        while(changed&&guard++<6){
            changed=false;
            for(const [src,out] of rules){
                for(let i=0;i+src.length<=toks.length;i++){
                    let ok=true;
                    for(let k=0;k<src.length;k++){ if(!same(toks[i+k].t,src[k])){ok=false;break;} }
                    if(!ok) continue;
                    const outToks=(outIsSeq?out:[out]);
                    if(outToks.length===src.length&&outToks.every((t,k)=>t===src[k])) continue;
                    const w=[...new Set(toks.slice(i,i+src.length).flatMap(x=>x.w))];
                    toks.splice(i,src.length,...outToks.map(t=>({t,w})));
                    changed=true; i+=outToks.length-1;
                }
            }
        }
        return toks;
    }
    // returns {words:[raw pieces], toks:[{t, w:[wordIdx]}]}
    function analyze(text){
        const parts=String(text||'').replace(/[’‘`]/g,"'").split(/([A-Za-z0-9가-힣]+)/);
        let toks=[];
        parts.forEach((p,i)=>{
            if(i%2===1){
                const lw=p.toLowerCase();
                toks.push({t:lw,w:[i]});
            }
        });
        // raw-level merges (a-com, in situ ...), then canonicalise each word
        toks=applyRules(toks,PRE_C,false);
        toks=toks.flatMap(x=>canonWord(x.t).split(' ').map(t=>({t,w:x.w})));
        toks=toks.filter(x=>!STOP.has(x.t)&&!(x.t.length===1&&!isKo(x.t)));
        toks=applyRules(toks,PHR_C,true);
        return {parts,toks};
    }
    function lev(a,b,max){
        if(Math.abs(a.length-b.length)>max) return max+1;
        let prev=Array.from({length:b.length+1},(_,i)=>i);
        for(let i=1;i<=a.length;i++){
            const cur=[i]; let best=i;
            for(let j=1;j<=b.length;j++){
                cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
                best=Math.min(best,cur[j]);
            }
            if(best>max) return max+1;
            prev=cur;
        }
        return prev[b.length];
    }
    function eq(a,b){
        if(a===b) return true;
        if(isKo(a)||isKo(b)) return (a.length>=2&&b.length>=2)&&(a.includes(b)||b.includes(a));
        if(/\d/.test(a)||/\d/.test(b)) return false;
        const m=Math.min(a.length,b.length);
        if(m>=5&&a[0]===b[0]){
            const tol=m>=10?2:1;
            if(lev(a,b,tol)<=tol) return true;
            if(m>=6&&(a.startsWith(b)||b.startsWith(a))) return true;
        }
        return false;
    }
    const cov=(cand,userT)=>{
        if(!cand.length) return null;
        let hit=0,tot=0;
        cand.forEach((t,i)=>{ const w=(i===cand.length-1&&cand.length>1)?1.5:1; tot+=w; if(userT.some(u=>eq(t,u))) hit+=w; });
        return hit/tot;
    };
    // --- answer structure ---
    // top-level split (outside parentheses) into findings
    function splitTop(s){
        const out=[]; let depth=0,cur='',i=0;
        const seps=[' → ','→',' - ',' with ',' and ',' & ','&',', ',',','; ',';',' / ',' + '];
        while(i<s.length){
            const ch=s[i];
            if(ch==='('){depth++;cur+=ch;i++;continue;}
            if(ch===')'){depth=Math.max(0,depth-1);cur+=ch;i++;continue;}
            if(depth===0){
                const low=s.slice(i).toLowerCase();
                const sep=seps.find(x=>low.startsWith(x));
                if(sep){ out.push({item:cur}); out.push({sep:s.slice(i,i+sep.length)}); cur=''; i+=sep.length; continue; }
            }
            cur+=ch;i++;
        }
        out.push({item:cur});
        return out;
    }
    function parseAlt(text){
        // split "outside (paren) outside" pieces
        const pieces=[]; let depth=0,cur='',pi=-1;
        for(const ch of text){
            if(ch==='('){ if(depth===0){ if(cur) pieces.push({kind:'out',text:cur}); cur=''; } else cur+=ch; depth++; continue; }
            if(ch===')'&&depth>0){ depth--; if(depth===0){ pieces.push({kind:'paren',text:cur}); cur=''; } else cur+=ch; continue; }
            cur+=ch;
        }
        if(cur) pieces.push({kind:depth?'paren':'out',text:cur});
        const outside=pieces.filter(p=>p.kind==='out').map(p=>p.text).join(' ').trim();
        const outT=analyze(outside).toks.map(x=>x.t);
        const parens=pieces.filter(p=>p.kind==='paren').map(p=>{
            const pt=analyze(p.text).toks.map(x=>x.t);
            const acr=s=>/^[A-Z][A-Za-z0-9\-]{1,7}$/.test(s.trim())&&(s.match(/[A-Z]/g)||[]).length>=2;
            const firstLetter=s=>(s.trim()[0]||'').toLowerCase();
            const subset=(a,b)=>a.length&&a.every(t=>b.some(u=>eq(t,u)));
            const isAlt=(acr(outside)&&firstLetter(outside)===firstLetter(p.text))||(acr(p.text)&&firstLetter(p.text)===firstLetter(outside))
                ||subset(pt,outT)||subset(outT,pt);
            p.toks=pt; p.alt=isAlt; return p;
        });
        return {pieces,outT,parens};
    }
    // split an item into either-or alternatives on ' or ' / '/', outside parentheses only
    function splitOr(text){
        const out=[]; let depth=0,cur='',i=0;
        while(i<text.length){
            const ch=text[i];
            if(ch==='('){depth++;cur+=ch;i++;continue;}
            if(ch===')'){depth=Math.max(0,depth-1);cur+=ch;i++;continue;}
            if(depth===0){
                const m=text.slice(i).match(/^(\s+or\s+|\/)/i);
                if(m){ out.push(cur); out.push({sep:m[0]}); cur=''; i+=m[0].length; continue; }
            }
            cur+=ch;i++;
        }
        out.push(cur); return out;
    }
    function structure(ans){
        return splitTop(ans).map(seg=>{
            if(seg.sep!==undefined) return seg;
            const ors=splitOr(seg.item).filter(x=>typeof x==='string');
            const alts=ors.map(parseAlt);
            return {item:seg.item,ors,alts};
        });
    }
    const EXTRA_W=0.3;
    function grade(ans,typed){
        const st=structure(ans);
        const U=analyze(typed);
        const userT=U.toks.map(x=>x.t);
        let num=0,den=0;
        const allAnsT=[];
        for(const seg of st){
            if(seg.sep!==undefined) continue;
            let best=null;
            seg.alts.forEach((a,ai)=>{
                a.outT.forEach(t=>allAnsT.push(t)); a.parens.forEach(p=>p.toks.forEach(t=>allAnsT.push(t)));
                const cands=[a.outT,...a.parens.filter(p=>p.alt).map(p=>p.toks)];
                let main=null;
                for(const c of cands){ const v=cov(c,userT); if(v!==null) main=main===null?v:Math.max(main,v); }
                const extras=a.parens.filter(p=>!p.alt).map(p=>cov(p.toks,userT));
                if(best===null||(main??-1)>(best.main??-1)) best={ai,main,extras};
            });
            seg.res=best;
            if(best&&best.main!==null){ num+=best.main; den+=1; }
            if(best) best.extras.forEach(v=>{ if(v!==null){ num+=v*EXTRA_W; den+=EXTRA_W; } });
        }
        const score=den?num/den:0;
        // which typed words matched something in the answer
        const okWords=new Set(), stopWords=new Set();
        U.toks.forEach(x=>{ if(allAnsT.some(t=>eq(t,x.t))) x.w.forEach(i=>okWords.add(i)); });
        const usedWords=new Set(U.toks.flatMap(x=>x.w));
        U.parts.forEach((p,i)=>{ if(i%2===1&&!usedWords.has(i)) stopWords.add(i); });
        return {score,st,user:U,okWords,stopWords,userT};
    }
    return {grade,analyze,structure,eq,splitOr};
})();
// ==MATCHER END==

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tcls=v=>v===null||v===undefined?'':v>=0.99?'typeGood':v>=0.5?'typePart':'typeMissed';

function renderCorrect(g){
    let h='';
    for(const seg of g.st){
        if(seg.sep!==undefined){ h+=esc(seg.sep); continue; }
        const r=seg.res;
        let altIdx=0;
        const inner=MATCH.splitOr(seg.item).map(piece=>{
            if(typeof piece!=='string') return esc(piece.sep);
            const a=seg.alts[altIdx]; const myIdx=altIdx++;
            const chosen=r&&r.ai===myIdx;
            let extraI=0;
            return a.pieces.map(p=>{
                if(p.kind==='out') return esc(p.text);
                if(p.alt) return '('+esc(p.text)+')';
                const v=chosen?r.extras[extraI++]:null;
                return '(<span class="paren-extra '+tcls(v)+'" title="괄호 속 부가 소견">'+esc(p.text)+'</span>)';
            }).join('');
        }).join('');
        const c=tcls(r?r.main:null);
        h+=c?'<span class="'+c+'">'+inner+'</span>':inner;
    }
    return h;
}
function renderTyped(g,typed){
    if(!typed.trim()) return '<span class="typeEmpty">(입력 없음)</span>';
    return g.user.parts.map((p,i)=>{
        if(i%2===0) return esc(p);
        if(g.stopWords.has(i)) return '<span class="typeStop">'+esc(p)+'</span>';
        return '<span class="'+(g.okWords.has(i)?'typeGood':'typeBad')+'">'+esc(p)+'</span>';
    }).join('');
}

function today(t=Date.now()){const d=new Date(t-4*3600e3);return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);}

// ---------- scheduler (Anki SM-2 style) ----------
function nextState(s0,ease,now=Date.now()){
    const s={...s0}; const td=today(now); const MIN=60e3;
    s.reps=(s.reps||0)+1; s.last=ease;
    const graduate=ivl=>{ s.t='rev'; s.ivl=ivl; s.due=td+ivl; s.step=0; };
    if(s.t==='new'||s.t==='lrn'){
        const st=cfg.steps.length?cfg.steps:[1];
        if(s.t==='new'){ s.t='lrn'; s.step=0; s.ease=s.ease||cfg.startEase; }
        if(ease===1){ s.step=0; s.due=now+st[0]*MIN; }
        else if(ease===2){ const d=(s.step===0&&st.length>1)?(st[0]+st[1])/2:(s.step===0?st[0]*1.5:st[s.step]); s.due=now+d*MIN; }
        else if(ease===3){ if(s.step+1<st.length){ s.step++; s.due=now+st[s.step]*MIN; } else graduate(cfg.gradIvl); }
        else graduate(cfg.easyIvl);
        return s;
    }
    if(s.t==='rlrn'){
        const st=cfg.relearn.length?cfg.relearn:[10];
        if(ease===1){ s.step=0; s.due=now+st[0]*MIN; }
        else if(ease===2){ s.due=now+(st[s.step]||st[0])*1.5*MIN; }
        else if(ease===3){ if(s.step+1<st.length){ s.step++; s.due=now+st[s.step]*MIN; } else { s.t='rev'; s.due=td+s.ivl; s.step=0; } }
        else { s.t='rev'; s.ivl=s.ivl+1; s.due=td+s.ivl; s.step=0; }
        return s;
    }
    const late=Math.max(0,td-s.due);
    if(ease===1){
        s.lapses=(s.lapses||0)+1; s.ease=Math.max(1.3,s.ease-0.2); s.ivl=1;
        s.t='rlrn'; s.step=0; s.due=now+(cfg.relearn[0]||10)*MIN; return s;
    }
    const hard=Math.max(s.ivl+1,Math.round((s.ivl+late/4)*1.2));
    const good=Math.max(hard+1,Math.round((s.ivl+late/2)*s.ease));
    const easy=Math.max(good+1,Math.round((s.ivl+late)*s.ease*1.3));
    if(ease===2){ s.ivl=hard; s.ease=Math.max(1.3,s.ease-0.15); }
    else if(ease===3){ s.ivl=good; }
    else { s.ivl=easy; s.ease+=0.15; }
    s.ivl=Math.min(s.ivl,36500); s.due=td+s.ivl; return s;
}
function fmtIvl(s,now=Date.now()){
    if(s.t==='lrn'||s.t==='rlrn'){
        const m=Math.max(1,Math.round((s.due-now)/60e3));
        return m<60?`${m}분`:`${Math.round(m/6)/10}시간`;
    }
    return fmtDays(s.ivl);
}
function fmtDays(d){ if(d<30) return `${d}일`; if(d<365) return `${Math.round(d/3)/10}개월`; return `${Math.round(d/36.5)/10}년`; }

function deckDef(id){

    if(id==='yama') return {id,name:'🔥 25년 야마',full:'🔥 25년 야마',filter:c=>YAMA.has(c.num),filtered:true};

function newLimitLeft(){ ensureDay(); return Math.max(0,cfg.newPerDay+(dayInfo.extraNew||0)-(dayInfo.newDone||0)); }
function counts(filter){
    const now=Date.now(), td=today(now), eod=dayStartMs(td+1);
    let n=0,l=0,r=0;
    for(const c of ALL){ if(!filter(c)) continue; const s=getS(c.num);
        if(s.t==='new') n++; else if(s.t==='lrn'||s.t==='rlrn'){ if(s.due<eod) l++; } else if(s.due<=td) r++; }
    return {n:Math.min(n,newLimitLeft()),l,r};
}
function pickSrs(filter,avoid){
    const now=Date.now(), td=today(now);
    const pool=ALL.filter(filter);
    const notLast=arr=>arr.length>1?arr.filter(c=>c.num!==avoid):arr;
    const due=(c)=>getS(c.num).due;
    const lrnDue=pool.filter(c=>{const s=getS(c.num);return (s.t==='lrn'||s.t==='rlrn')&&s.due<=now;}).sort((a,b)=>due(a)-due(b));
    if(lrnDue.length) return notLast(lrnDue)[0];
    const rev=pool.filter(c=>{const s=getS(c.num);return s.t==='rev'&&s.due<=td;}).sort((a,b)=>due(a)-due(b)||a.num-b.num);
    const nw=newLimitLeft()>0?pool.filter(c=>getS(c.num).t==='new'):[];
    if(rev.length||nw.length){
        const pickRev=rev.length&&(!nw.length||Math.random()<rev.length/(rev.length+nw.length));
        return pickRev?notLast(rev)[0]:nw[0];
    }
    const ahead=pool.filter(c=>{const s=getS(c.num);return (s.t==='lrn'||s.t==='rlrn')&&s.due<=now+20*60e3;}).sort((a,b)=>due(a)-due(b));
    if(ahead.length) return notLast(ahead)[0];
    return null;
}

// ---------- reviewer ----------
let renderToken=0, pending=[];
function makeImg(container,f,maxHFor,token){
    const wrap=document.createElement('div');
    wrap.className='img-crop-wrap';
    Object.assign(wrap.style,{display:'flex',justifyContent:'center',alignItems:'center',width:'160px',aspectRatio:'1 / 1'});
    const loader=document.createElement('div'); loader.className='img-loading'; loader.textContent='불러오는 중…';
    wrap.appendChild(loader); container.appendChild(wrap);
    const im=new Image(); pending.push(im);
    let tries=0;
    im.onload=function(){
        if(token!==renderToken) return;
        loader.remove();
        const isGif=f.toLowerCase().endsWith('.gif');
        wrap.style.display='';
        wrap.onclick=e=>{e.stopPropagation();openImg(this.src,isGif);};
        const inner=document.createElement('div'); inner.className='img-inner-box'+(isGif?' no-crop':'');
        const di=document.createElement('img'); di.src=this.src; di.alt=''; inner.appendChild(di); wrap.appendChild(inner);
        let cw=this.naturalWidth, ch=this.naturalHeight;
        if(!isGif){ cw*=0.66; ch*=0.67; }
        wrap.style.aspectRatio=`${cw} / ${ch}`;
        const maxH=maxHFor();
        wrap.style.width=(ch>maxH?cw*(maxH/ch):cw)+'px';
    };
    im.onerror=function(){
        if(token!==renderToken) return;
        if(tries<RAW_FALLBACKS.length){ im.src=RAW_FALLBACKS[tries++]+f; return; }
        loader.textContent='✗ 불러오기 실패'; loader.style.color='#f87171';
    };
    im.src=B+f;
}

function showCard(c){
    pending.forEach(im=>{im.onload=im.onerror=null;im.src='';}); pending=[];
    const token=++renderToken;
    current=c; revealed=false; lastShown=c.num; shownAt=Date.now();
    const s=getS(c.num);
    const deckLabel=session&&session.type!=='srs'?`${esc(session.label)} · `:'';
    $('meta').innerHTML=`${deckLabel}No.${c.num} · ${esc(c.cat)} · <span class="st-${queueOf(s)}">${esc(stateName(s))}</span>`;
    if(c.q){ $('qtext').textContent=c.q; $('qtext').hidden=false; } else $('qtext').hidden=true;
    const fDiv=$('fImgs'); fDiv.innerHTML=''; fDiv.className='imgs';
    const n=c.front.length;
    if(n===2) fDiv.classList.add('multi'); if(n>=3) fDiv.classList.add('many');
    c.front.forEach(f=>makeImg(fDiv,f,()=>{ let m=n>=3?360:440; if(window.innerWidth<=640) m=n===1?380:(n===2?300:260); return m; },token));
    const inp=$('typeans'); inp.value=''; inp.disabled=false;
    $('answerPart').hidden=true; $('typecmp').innerHTML=''; $('gradeNote').innerHTML=''; $('keyPart').innerHTML='';
    $('memo').value=notes[c.num]||'';
    renderBar();
    window.scrollTo(0,0);
    if(window.matchMedia('(pointer:fine)').matches) setTimeout(()=>inp.focus({preventScroll:true}),30);
}

function reveal(giveUp=false){
    if(!current||revealed) return;
    const inp=$('typeans'); const typed=giveUp?'':inp.value;
    if(!giveUp&&!typed.trim()){
        const f=$('typeForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
        tip('답을 입력하세요 — 모르면 “모르겠어요”'); inp.focus(); return;
    }
    revealed=true; inp.blur(); inp.disabled=true; if(giveUp) inp.value='';
    const c=current, g=MATCH.grade(c.ans,typed);
    suggested=giveUp||!typed.trim()?1:g.score>=0.75?3:g.score>=0.4?2:1;
    $('typecmp').innerHTML=`<div>${renderTyped(g,typed)}</div><div class="typearrow">↓</div><div>${renderCorrect(g)}</div>`;
    const names=['','다시','어려움','알맞음','쉬움'];
    $('gradeNote').innerHTML=(giveUp?'모르겠어요':`자동 채점 ${Math.round(g.score*100)}%`)+` · 추천: ${names[suggested]}`+
        `<span class="lg"><span><i class="typeGood"></i>맞음</span><span><i class="typePart"></i>일부</span><span><i class="typeMissed"></i>놓침</span><span><i class="typeBad"></i>정답에 없음</span></span>`;
    if(c.key.length){
        $('keyPart').innerHTML='<div class="keyhead">Key images</div><div class="keyimgs" id="keyImgs"></div>';
        const k=$('keyImgs'); c.key.forEach(f=>makeImg(k,f,()=>window.innerWidth<=640?260:320,renderToken));
    }
    $('answerPart').hidden=false;
    renderBar();
    const hr=$('answerHr').getBoundingClientRect();
    if(hr.top>window.innerHeight*0.55) window.scrollBy({top:hr.top-60,behavior:'smooth'});
}
$('memo').addEventListener('input',()=>{ if(current){ notes[current.num]=$('memo').value; save(LS.notes,notes);} });

function answer(ease){
    if(!current||!revealed) return;
    ensureDay();
    const n=current.num, prevS=srs[n]?{...srs[n]}:null;
    undoStack.push({num:n,prevS,day:{...dayInfo},score:session&&session.scores[n],idx:session&&session.idx,session});
    if(undoStack.length>30) undoStack.shift();
    const s=getS(n);
    if(s.t==='new') dayInfo.newDone=(dayInfo.newDone||0)+1;
    dayInfo.reviewed=(dayInfo.reviewed||0)+1; if(ease===1) dayInfo.again=(dayInfo.again||0)+1;
    dayInfo.ms=(dayInfo.ms||0)+Math.min(60000,Date.now()-shownAt);
    const ns=nextState(s,ease); srs[n]=ns;
    save(LS.srs,srs); save(LS.day,dayInfo);
    if(session) session.scores[n]=ease===1?'dunno':'know';
    tip(`${['','다시','어려움','알맞음','쉬움'][ease]} — ${fmtIvl(ns)} 후`);
    nextCard();
}
function undo(){
    const u=undoStack.pop(); if(!u){ tip('되돌릴 항목이 없어요'); return; }
    if(u.prevS) srs[u.num]=u.prevS; else delete srs[u.num];
    dayInfo=u.day; save(LS.srs,srs); save(LS.day,dayInfo);
    session=u.session||session;
    if(session){ if(u.score===undefined) delete session.scores[u.num]; else session.scores[u.num]=u.score; if(session.type==='practice'&&u.idx!==undefined) session.idx=u.idx; }
    ovMode='normal';
    if(screen!=='review') go('review');
    showCard(BYNUM[u.num]); tip('되돌림');
}

function countsLine(){

function renderBrowse(){
    const sel=$('bdeck');
    if(!sel.options.length){
        sel.innerHTML=`<option value="all">전체 덱</option>`+CATS.map(c=>`<option value="cat:${esc(c)}">${esc(c)}</option>`).join('')+`<option value="yama">🔥 25년 야마</option>`;
    }
    const q=$('bq').value.trim().toLowerCase(), dsel=deckDef(sel.value), td=today();
    let rows=ALL.filter(dsel.filter).map(c=>({c,s:getS(c.num)}));
    for(const term of q.split(/\s+/).filter(Boolean)){
        if(term==='is:new') rows=rows.filter(r=>r.s.t==='new');
        else if(term==='is:learn') rows=rows.filter(r=>r.s.t==='lrn'||r.s.t==='rlrn');
        else if(term==='is:review') rows=rows.filter(r=>r.s.t==='rev');
        else if(term==='is:due') rows=rows.filter(r=>(r.s.t==='rev'&&r.s.due<=td)||((r.s.t==='lrn'||r.s.t==='rlrn')&&r.s.due<=Date.now()));
        else if(term.startsWith('deck:')){ const d=term.slice(5); rows=rows.filter(r=>r.c.cat.toLowerCase().replace(/\s/g,'').includes(d.replace(/\s/g,''))); }
        else if(/^\d+$/.test(term)) rows=rows.filter(r=>r.c.num===+term);
        else rows=rows.filter(r=>(r.c.ans+' '+r.c.cat+' '+(r.c.q||'')+' '+(notes[r.c.num]||'')).toLowerCase().includes(term));
    }
    const key=r=>{ const s=r.s; switch(browseSort.k){
        case 'ans': return r.c.ans.toLowerCase(); case 'cat': return r.c.cat; case 'num': return r.c.num;
        case 'due': return s.t==='new'?1e15+r.c.num:(s.t==='rev'?dayStartMs(s.due):s.due);
        case 'ivl': return s.t==='rev'?s.ivl:-1; case 'ease': return s.t==='new'?0:s.ease; case 'lapses': return s.lapses||0; } };
    rows.sort((a,b)=>{ const x=key(a),y=key(b); return (x<y?-1:x>y?1:a.c.num-b.c.num)*browseSort.dir; });
    const dueTxt=s=>{
        if(s.t==='new') return '<span class="s-new">새 카드</span>';
        if(s.t==='lrn'||s.t==='rlrn'){ const d=new Date(s.due); return `<span class="s-learn">${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span>`; }
        const d=new Date(dayStartMs(s.due)); return `<span class="s-review">${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}</span>`;
    };
    $('btbody').innerHTML=rows.map(({c,s})=>`<tr data-n="${c.num}"><td class="sf">${esc(c.ans)}</td><td>${c.num}</td><td>${esc(c.cat)}</td><td>${dueTxt(s)}</td><td class="hide-sm">${s.t==='rev'?fmtDays(s.ivl):(s.t==='new'?'(새 카드)':'(학습 중)')}</td><td class="hide-sm">${s.t==='new'?'(새 카드)':Math.round(s.ease*100)+'%'}</td><td class="hide-sm">${s.lapses||0}</td></tr>`).join('')
        ||`<tr><td colspan="7" style="text-align:center;color:var(--fg-faint);padding:20px">검색 결과 없음</td></tr>`;
    document.querySelectorAll('.btable th').forEach(th=>{ const k=th.dataset.sort; th.innerHTML=th.textContent.replace(/[▲▼]/g,'').trim()+(k===browseSort.k?` <span class="arr">${browseSort.dir>0?'▲':'▼'}</span>`:''); });
    $('bfoot').textContent=`${rows.length}장 표시 중 · 행을 누르면 그 카드를 바로 풀어볼 수 있어요`;
}

    const td=today(), now=Date.now();
    let n=0,l=0,young=0,mature=0;
    for(const c of ALL){ const s=getS(c.num); if(s.t==='new') n++; else if(s.t!=='rev') l++; else if(s.ivl<21) young++; else mature++; }
    const fc=[]; for(let i=0;i<8;i++) fc.push(0);
    for(const c of ALL){ const s=getS(c.num);
        if(s.t==='rev'){ const d=Math.max(0,s.due-td); if(d<8) fc[d]++; }
        else if(s.t!=='new'){ const d=Math.max(0,today(s.due)-td); if(d<8) fc[d]++; } }
    const done=dayInfo.reviewed||0, again=dayInfo.again||0, mins=Math.round((dayInfo.ms||0)/60000), per=done?Math.round((dayInfo.ms||0)/done/1000):0;
    const dayLbl=i=>i===0?'오늘':i===1?'내일':`${i}일 후`;
    $('scrStats').innerHTML=`<div class="stats">
        <h3>오늘</h3>
        <p>${done?`오늘 ${done}장을 ${mins}분 동안 학습했습니다 (카드당 ${per}초).<br>다시: ${again}장 · 정답률 ${Math.round((done-again)/done*100)}%`:'오늘은 아직 학습한 카드가 없습니다.'}</p>
        <h3>카드 수</h3>
        <table class="st"><tr><th>새 카드</th><td class="s-new">${n}</td></tr><tr><th>학습 중</th><td class="s-learn">${l}</td></tr><tr><th>어린 카드 (간격 21일 미만)</th><td class="s-review">${young}</td></tr><tr><th>성숙 카드 (21일 이상)</th><td class="s-review">${mature}</td></tr><tr><th>합계</th><td>${ALL.length}</td></tr></table>
        <h3>향후 복습 예정</h3>
        <table class="st"><tr>${fc.map((_,i)=>`<th>${dayLbl(i)}</th>`).join('')}</tr><tr>${fc.map(v=>`<td>${v}</td>`).join('')}</tr></table>
        <p style="margin-top:8px">오늘 칸에는 밀린 복습과 학습 중 카드가 포함돼요.</p>
    </div>`;
}

// ---------- dialogs ----------
function openDlg(id){ $(id).classList.add('on'); }
function closeDlg(id){ $(id).classList.remove('on'); }
document.querySelectorAll('.dlg-bg').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('on'); }));
function openOptions(){
    $('cfgNew').value=cfg.newPerDay; $('cfgSteps').value=cfg.steps.join(' '); $('cfgRelearn').value=cfg.relearn.join(' ');
    $('cfgGrad').value=`${cfg.gradIvl} ${cfg.easyIvl}`; $('cfgTheme').value=ui.theme||'auto'; openDlg('dlgOptions');
}
function saveSettings(){
    const nums=s=>String(s).split(/[\s,]+/).map(Number).filter(x=>x>0);
    cfg.newPerDay=Math.max(0,Math.min(117,+$('cfgNew').value||0));
    cfg.steps=nums($('cfgSteps').value).length?nums($('cfgSteps').value):DEF_CFG.steps;
    cfg.relearn=nums($('cfgRelearn').value).length?nums($('cfgRelearn').value):DEF_CFG.relearn;
    const g=nums($('cfgGrad').value); cfg.gradIvl=Math.round(g[0]||1); cfg.easyIvl=Math.round(g[1]||4);
    ui.theme=$('cfgTheme').value; save(LS.ui,ui); applyTheme();
    save(LS.cfg,cfg); closeDlg('dlgOptions'); tip('설정 저장됨');
    if(screen==='decks') renderDecks(); else if(screen==='overview') renderOverview(); else renderBar();
}
function openCustomFor(id){ deck=deckDef(id); ui.deck=deck.id; save(LS.ui,ui); openCustom(); }
function openCustom(){ $('customDeckLine').textContent=`대상 덱: ${deck.full}`; openDlg('dlgCustom'); }
function applyCustom(){
    const v=(document.querySelector('input[name=cs]:checked')||{}).value;
    closeDlg('dlgCustom');
    const base=ALL.filter(deck.filter);
    if(v==='morenew'){ moreNew(); return; }
    if(v==='seq') return startPractice(base,`${deck.name} · 순서대로`);
    if(v==='shuf'){ const p=[...base]; shuffle(p); return startPractice(p,`${deck.name} · 셔플`); }
    if(v==='wrong') return startPractice(base.filter(c=>getS(c.num).last===1),`${deck.name} · 최근 틀린 카드`);
    if(v==='rand10'){ const p=[...base]; shuffle(p); return startPractice(p.slice(0,10),`${deck.name} · 랜덤 10장`); }
    if(v==='yama') return startPractice(base.filter(c=>YAMA.has(c.num)),'25년 야마');
    if(v==='yama_shuf'){ const p=base.filter(c=>YAMA.has(c.num)); shuffle(p); return startPractice(p,'25년 야마 셔플'); }
    if(v==='range'){
        let s=+$('rS').value||1,e=+$('rE').value||127; s=Math.max(1,Math.min(127,s)); e=Math.max(s,Math.min(127,e));
        return startPractice(base.filter(c=>c.num>=s&&c.num<=e),`No.${s}~${e}`);
    }
}
document.querySelectorAll('.rangein input').forEach(i=>i.addEventListener('focus',()=>{ document.querySelector('input[name=cs][value=range]').checked=true; }));

function exportData(){
    const blob=new Blob([JSON.stringify({v:1,srs,notes,cfg,day:dayInfo,exported:new Date().toISOString()},null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`radiology-anki-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(input){
    const f=input.files&&input.files[0]; if(!f) return;
    f.text().then(t=>{
        const d=JSON.parse(t); if(!d||typeof d.srs!=='object') throw 0;
        srs=d.srs||{}; notes=d.notes||notes; if(d.cfg) cfg={...DEF_CFG,...d.cfg};
        save(LS.srs,srs); save(LS.notes,notes); save(LS.cfg,cfg);
        closeDlg('dlgOptions'); tip('백업을 불러왔어요'); go('decks');
    }).catch(()=>tip('백업 파일을 읽을 수 없어요')).finally(()=>{input.value='';});
}
function resetProgress(){
    if(!confirm('모든 카드의 학습 기록(간격 반복)을 초기화할까요? 메모는 유지됩니다.')) return;
    srs={}; dayInfo={}; ensureDay(); undoStack=[]; save(LS.srs,srs);
    closeDlg('dlgOptions'); tip('학습 기록 초기화됨'); session=null; go('decks');
}

function openImg(src,isGif){
    const wrap=$('imgModalContainer'), img=$('imgModalImg'), inner=wrap.querySelector('.img-inner-box');
    inner.classList.toggle('no-crop',!!isGif);
    wrap.style.width='auto'; wrap.style.aspectRatio='auto';
    img.onload=function(){
        let cw=this.naturalWidth, ch=this.naturalHeight;
        if(!isGif){ cw*=0.66; ch*=0.67; }
        wrap.style.aspectRatio=`${cw} / ${ch}`;
        const maxH=window.innerHeight*0.92, maxW=window.innerWidth*0.94;
        let w=cw; if(ch>maxH) w=cw*(maxH/ch); if(w>maxW) w=maxW;
        wrap.style.width=w+'px';
    };
    img.src=src; $('imgModal').classList.add('on');
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
let tipT;
function tip(m){ const t=$('tip'); t.textContent=m; t.classList.add('on'); clearTimeout(tipT); tipT=setTimeout(()=>t.classList.remove('on'),1700); }

// ---------- keyboard (Anki shortcuts) ----------
document.addEventListener('keydown',e=>{
    const tgt=e.target, tag=tgt.tagName, typing=tag==='TEXTAREA'||tag==='SELECT'||(tag==='INPUT'&&tgt.type!=='radio');
    const dlgOpen=document.querySelector('.dlg-bg.on,.img-modal.on');
    if(e.key==='Escape'){
        if(dlgOpen){ dlgOpen.classList.remove('on'); return; }
        if(tag==='TEXTAREA'||(tgt.id==='typeans'&&tgt.value)){ tgt.blur(); return; }
        if($('moreMenu')&&$('moreMenu').classList.contains('on')){ closeMenu(); return; }
        if(screen==='review'){ exitReview(); return; }
        if(screen!=='decks'){ go('decks'); return; }
        return;
    }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!(typing&&tgt.value)){ e.preventDefault(); undo(); return; }
    if(!dlgOpen&&tgt.id==='typeans'&&!tgt.value&&session&&session.type==='practice'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){ e.preventDefault(); e.key==='ArrowRight'?nextCard():prevCard(); return; }
    if(dlgOpen||typing||e.ctrlKey||e.metaKey||e.altKey) return;
    const k=e.key.toLowerCase();
    if(k==='d'){ go('decks'); return; }
    if(k==='b'){ if(screen==='review'&&current) browseCard(current.num); else go('browse'); return; }
    if(k==='t'){ go('stats'); return; }
    if(screen==='overview'&&(k==='s'||e.key==='Enter'||e.key===' ')){ const b=$('studyBtn'); if(b){ e.preventDefault(); b.click(); } return; }
    if(screen!=='review'||!current) return;
    if(!revealed){
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); const i=$('typeans'); if(i.value.trim()) reveal(); else i.focus(); }
    } else {
        if(['1','2','3','4'].includes(e.key)){ e.preventDefault(); answer(+e.key); return; }
        if(e.key===' '||e.key==='Enter'){ e.preventDefault(); answer(suggested); return; }
        if(k==='e'){ e.preventDefault(); $('memo').focus(); return; }
    }
    if(session&&session.type==='practice'){ if(e.key==='ArrowRight') nextCard(); else if(e.key==='ArrowLeft') prevCard(); }
});

go('decks');
</script>
